<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>src check</title></head><body><pre id="o">loading</pre>
<script>
(async()=>{const P=['index','shop','sell','breaks','visit'];let out=[];
for(const p of P){const t=await (await fetch(p+'.html?nc='+Date.now(),{cache:'no-store'})).text();
const gtm=(t.match(/GTM-MBJS8SCV/g)||[]).length;const og=(t.match(/property="og:image" content="([^"]+)"/)||[])[1];const tw=(t.match(/name="twitter:image" content="([^"]+)"/)||[])[1];
const fav=/favicon-32\.png/.test(t)&&/apple-touch-icon/.test(t);const tel=(t.match(/tel:\+16037608134/g)||[]).length;const demo=/This is a demo website/.test(t);
out.push(p+': GTM x'+gtm+' | og '+og+' | tw '+tw+' | favicon '+fav+' | tel x'+tel+' | demo note '+demo);}
const d=await (await fetch('../index.html?nc='+Date.now(),{cache:'no-store'})).text();
out.push('demos index: chris tile '+/chris-cards\//.test(d)+' | '+((d.match(/[^.<>]{0,40}13[^.<>]{0,40}/g)||[]).slice(0,3).join(' / ')));
document.getElementById('o').textContent=out.join('\n');})();
</script></body></html>
